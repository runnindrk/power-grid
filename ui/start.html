<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Power Grid | Start</title>
<link rel="stylesheet" href="css/start.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Oswald:wght@500;700&display=swap" rel="stylesheet">
</head>
<body>
<main class="start-page">
  <header class="start-header">
    <h1>Power Grid</h1>
  </header>
  <section class="start-panel" aria-labelledby="setup-title">
    <h2 id="setup-title">Set the Table</h2>
    <form id="new-game-form">
      <label for="player-count">Number of Players</label>
      <input id="player-count" name="number_of_players" type="number" min="2" max="6" step="1" value="4" required>
      <fieldset id="player-aliases">
        <legend>Player Aliases</legend>
        <div id="player-alias-list"></div>
      </fieldset>
      <button id="new-game" type="submit">New Game</button>
    </form>
    <section id="saved-games-panel" aria-label="Available saved games">
      <h3>Saved Games</h3>
      <ul id="saved-games-list"></ul>
    </section>
    <p id="setup-status" role="status" aria-live="polite"></p>
  </section>
</main>
<script type="module" src="js/start.js"></script>
</body>
</html>
