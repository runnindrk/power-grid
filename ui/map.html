<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Power Grid</title>
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/map-view.css">
<link rel="stylesheet" href="css/cards.css">
<link rel="stylesheet" href="css/money-card.css">
<link rel="stylesheet" href="css/replenishment-card.css">
<link rel="stylesheet" href="css/power-plant-market.css">
<link rel="stylesheet" href="css/player-board.css">
<link rel="stylesheet" href="css/resource-market.css">
</head>
<body>
<header>
  <h1>Power Grid</h1>
  <span id="stats"></span>
  <span class="toolbar-divider" aria-hidden="true"></span>
  <span id="turn-order" aria-label="Player turn order"></span>
  <div id="map-controls">
    <span id="placement-status" aria-live="polite"></span>
  </div>
</header>
<main>
  <div id="board-layout">
    <aside id="dashboard-panel" aria-label="Game dashboard">
      <section id="player-board" aria-label="Player boards"></section>
      <div id="cards-panel">
        <section id="resource-market" aria-label="Resource market"></section>
        <div class="cards-board">
          <div id="info-cards"></div>
          <section id="power-plant-market" aria-label="Power plant market">
            <div class="power-plant-grid"></div>
          </section>
        </div>
      </div>
    </aside>
    <div id="map-panel">
      <svg id="map"></svg>
    </div>
  </div>
  <div id="tooltip"></div>
</main>

<script type="module" src="js/main.js"></script>
</body>
</html>
